_format_version: "3.0"

services:
  - name: productos-service
    # Correccion de la guia: la API usa setGlobalPrefix('api/v1'), por eso la url incluye /api/v1.
    url: http://host.docker.internal:3000/api/v1
    routes:
      - name: productos-route
        paths:
          - /productos
        # Correccion de la guia: strip_path es true por defecto y Kong reenviaria "/productos" como "/".
        strip_path: false
    plugins:
      # Paso 4 (corazon de la semana): 5 peticiones por minuto; contador en memoria del nodo.
      - name: rate-limiting
        config:
          minute: 5
          policy: local
      # Paso 5: trazabilidad. Valor fijo, tal cual la guia (ver README: mejora opcional con el plugin correlation-id).
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Correlation-Id:kong-generado"

  # Paso 7 (reto): Aggregator/BFF que combina la API REST y la API GraphQL.
  - name: bff-productos-service
    url: http://host.docker.internal:3001
    routes:
      - name: productos-completos-route
        paths:
          - /productos-completos
        # Correccion de la guia: sin esto Kong reenviaria "/productos-completos/1" como "/1".
        strip_path: false
    plugins:
      # Extension: el mismo header para que el BFF lo reciba y lo reenvie a REST y GraphQL.
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Correlation-Id:kong-generado"
